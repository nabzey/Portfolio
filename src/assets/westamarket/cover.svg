<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Muted Earthy Pastel Background -->
  <rect width="800" height="600" fill="#fcf8f2" />
  
  <!-- Subtle decorative shapes -->
  <circle cx="150" cy="150" r="250" fill="#fdf0d5" opacity="0.6" />
  <circle cx="650" cy="450" r="300" fill="#f4e3c5" opacity="0.4" />
  <rect x="600" y="100" width="100" height="100" fill="#d97757" opacity="0.05" rx="20" transform="rotate(15 650 150)" />
  <rect x="100" y="400" width="120" height="120" fill="#d97757" opacity="0.05" rx="20" transform="rotate(-15 160 460)" />
  
  <!-- Shopping Bag Icon -->
  <g transform="translate(300, 150)">
    <!-- Handle -->
    <path d="M 60 70 Q 100 -20 140 70" fill="none" stroke="#d97757" stroke-width="16" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <rect x="20" y="70" width="160" height="180" fill="#d97757" rx="16" />
    <path d="M 20 120 L 180 120" fill="none" stroke="#000000" stroke-width="4" opacity="0.1" />
    
    <!-- Pocket / Detail -->
    <rect x="60" y="140" width="80" height="70" fill="#ffffff" opacity="0.25" rx="8" />
  </g>
  
  <!-- Text -->
  <text x="400" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="#4a3b32" letter-spacing="-1">WestaMarket</text>
  <text x="400" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#8c7b70" letter-spacing="6">MODERN MARKETPLACE</text>
</svg>
