<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Decorative Background Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="2">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Trending Line in Background -->
  <path d="M -50 500 Q 150 500 250 350 T 550 250 T 850 50" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="15" stroke-linecap="round" />
  
  <!-- Circle container for icon -->
  <circle cx="400" cy="270" r="120" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  
  <!-- PW Text -->
  <text x="400" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-2">PW</text>
  
  <!-- Statistics Icon (Bar Chart + Trending Arrow) -->
  <g transform="translate(360, 330)">
    <!-- Bars -->
    <rect x="0" y="25" width="16" height="25" fill="#60a5fa" rx="3" />
    <rect x="25" y="10" width="16" height="40" fill="#818cf8" rx="3" />
    <rect x="50" y="18" width="16" height="32" fill="#a78bfa" rx="3" />
    <rect x="75" y="-5" width="16" height="55" fill="#c084fc" rx="3" />
    
    <!-- Trending Arrow -->
    <path d="M 5 15 L 30 -5 L 55 5 L 85 -25" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="70,-25 85,-25 85,-10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
